services:
  db:
    image: mysql:9
    container_name: biblioteca-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-BibliotecaRoot2026}
      MYSQL_DATABASE: biblioteca
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  laravel-backend:
    build:
      context: ./server-laravel
      dockerfile: Dockerfile
    container_name: biblioteca-laravel
    restart: unless-stopped
    env_file:
      - ./server-laravel/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8081
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: biblioteca
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-BibliotecaRoot2026}
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  biblioteca-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: biblioteca-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - laravel-backend

volumes:
  db_data: